name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  # The ONNX runtime of the [rag] extra would send usage events to its publisher from the test run.
  ORT_DISABLE_TELEMETRY: "1"
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[vault,companies,rag,dev]"
      - run: ruff check .
      - run: python -m pytest -q
