[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "myopenfund-mcp"
version = "0.1.0"
description = "One MCP server over the MyOpenFund bricks: official documents and pipeline health today, RAG and company data next."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["fastmcp>=4.1.4,<5"]

[project.optional-dependencies]
vault = ["vault-query @ git+https://github.com/MyOpenFund/vault@d3c44970a0827b2563073a1dc0a82093a63ac496#subdirectory=query"]
companies = [
  "open-data-store[reader] @ git+https://github.com/MyOpenFund/open-data-store@7a86987908c177a3f38e285b828cc03ed40f6f8b",
  # company-corpus[live]: live SEC fetching (no-vault mode). Tracks branch feat/live-sec until it merges: bump to the merge commit.
  "company-corpus[live] @ git+https://github.com/MyOpenFund/company-corpus@8effb61a8437ebf2e734cf5fd559d63608747c4d",
]
# [onnx]: queries are embedded on the ONNX runtime (CPU), without PyTorch.
# Same distribution and commit as [filings]: two extras never install two distributions shipping rag_engine.
# Tracks branch feat/local-index until it merges.
rag = ["myopenfund-rag-engine[onnx] @ git+https://github.com/MyOpenFund/rag-engine@ce5a745a9e0b4a6a96c6b21d79aa0b7b1e7cc0e7"]
# [filings]: the local filings index (no-vault mode). The distribution is myopenfund-rag-engine from this
# commit on. Tracks branch feat/local-index until it merges: bump to the merge commit.
filings = ["myopenfund-rag-engine[local,graph] @ git+https://github.com/MyOpenFund/rag-engine@ce5a745a9e0b4a6a96c6b21d79aa0b7b1e7cc0e7"]
dev = ["pytest>=8.3", "ruff>=0.6"]

[project.scripts]
myopenfund-mcp = "myopenfund_mcp.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/myopenfund_mcp"]

[tool.pytest.ini_options]
markers = [
  "integration: needs a real vault database (MOF_MCP_IT_DATABASE_URL), a real company store (MOF_MCP_IT_COMPANIES_CATALOG + MOF_MCP_IT_COMPANIES_DATA_ROOT) or a throwaway Qdrant (MOF_MCP_IT_QDRANT_URL)",
  "llm: needs a local Ollama (MOF_MCP_IT_OLLAMA_URL)",
]
addopts = "-m 'not integration and not llm'"

[tool.ruff]
line-length = 110
