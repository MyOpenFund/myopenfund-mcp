[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "myopenfund-mcp"
dynamic = ["version"]
description = "One MCP server over the MyOpenFund bricks: official documents and pipeline health today, RAG and company data next."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Marc Jeulin" }]
maintainers = [{ name = "Marc Jeulin" }]
keywords = ["myopenfund", "mcp", "model-context-protocol", "rag", "open-data", "filings"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Intended Audience :: Developers",
]
dependencies = ["fastmcp>=4.1.4,<5"]

# The MyOpenFund siblings come from PyPI, each capped below the next breaking 0.x.
[project.optional-dependencies]
vault = ["myopenfund-vault-query>=0.1.0,<0.2"]
companies = [
  "myopenfund-open-data-store[reader]>=0.1.0,<0.2",
  "myopenfund-company-corpus>=0.1.0,<0.2",
]
# [onnx]: queries are embedded on the ONNX runtime (CPU), without PyTorch.
rag = ["myopenfund-rag-engine[onnx]>=0.1.0,<0.2"]
dev = ["pytest>=8.3", "ruff>=0.6", "pyyaml>=6"]

[project.urls]
Homepage = "https://github.com/MyOpenFund/myopenfund-mcp"
Source = "https://github.com/MyOpenFund/myopenfund-mcp"
Issues = "https://github.com/MyOpenFund/myopenfund-mcp/issues"
Organization = "https://github.com/MyOpenFund"

[project.scripts]
myopenfund-mcp = "myopenfund_mcp.cli:main"

[tool.hatch.version]
path = "src/myopenfund_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/myopenfund_mcp"]

[tool.pytest.ini_options]
markers = [
  "integration: needs a real vault database (MOF_MCP_IT_DATABASE_URL), a real company store (MOF_MCP_IT_COMPANIES_CATALOG + MOF_MCP_IT_COMPANIES_DATA_ROOT) or a throwaway Qdrant (MOF_MCP_IT_QDRANT_URL)",
  "llm: needs a local Ollama (MOF_MCP_IT_OLLAMA_URL)",
]
addopts = "-m 'not integration and not llm'"

[tool.ruff]
line-length = 110
