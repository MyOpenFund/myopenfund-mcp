[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "myopenfund-mcp"
version = "0.1.0"
description = "One MCP server over the MyOpenFund bricks: official documents and pipeline health today, RAG and company data next."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["fastmcp>=4.1.4,<5"]

[project.optional-dependencies]
vault = ["vault-query @ git+https://github.com/MyOpenFund/vault@12ffd11d15c90c8133dc8c8a38b8e47e3b6a4fce#subdirectory=query"]
companies = [
  "my-open-data[reader] @ git+https://github.com/MyOpenFund/my-open-data@3252e97dd6808290895cc4e117685388e6d4e354",
  "company-corpus @ git+https://github.com/MyOpenFund/company-corpus@06c619d7d216d230b92ea62394672f8dd443830f",
]
# [onnx]: queries are embedded on the ONNX runtime (CPU), without PyTorch.
rag = ["rag-engine[onnx] @ git+https://github.com/MyOpenFund/rag-engine@6be21ac393d82d7c5c1a058dcad8204ae15c7289"]
dev = ["pytest>=8.3", "ruff>=0.6"]

[project.scripts]
myopenfund-mcp = "myopenfund_mcp.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/myopenfund_mcp"]

[tool.pytest.ini_options]
markers = [
  "integration: needs a real vault database (MOF_MCP_IT_DATABASE_URL), a real company store (MOF_MCP_IT_COMPANIES_CATALOG + MOF_MCP_IT_COMPANIES_DATA_ROOT) or a throwaway Qdrant (MOF_MCP_IT_QDRANT_URL)",
  "llm: needs a local Ollama (MOF_MCP_IT_OLLAMA_URL)",
]
addopts = "-m 'not integration and not llm'"

[tool.ruff]
line-length = 110
