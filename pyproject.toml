[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "myopenfund-mcp"
dynamic = ["version"]
description = "One MCP server over the MyOpenFund bricks: official documents, pipeline health, RAG search and company data."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Marc Jeulin" }]
maintainers = [{ name = "Marc Jeulin" }]
keywords = ["myopenfund", "mcp", "model-context-protocol", "rag", "open-data", "filings"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Intended Audience :: Developers",
]
dependencies = ["fastmcp>=4.1.4,<5"]

# The MyOpenFund siblings come from PyPI, each capped below the next breaking 0.x.
[project.optional-dependencies]
vault = ["myopenfund-vault-query>=0.1.0,<0.2"]
companies = [
  "myopenfund-open-data-store[reader]>=0.1.0,<0.2",
  # [live]: live SEC fetching (no-vault mode), new in company-corpus 0.2.0.
  "myopenfund-company-corpus[live]>=0.2.0,<0.3",
]
# [onnx]: queries are embedded on the ONNX runtime (CPU), without PyTorch.
# Same range as [filings]: the two extras resolve one myopenfund-rag-engine release.
rag = ["myopenfund-rag-engine[onnx]>=0.2.1,<0.3"]
# [filings]: the local filings index (no-vault mode), new in rag-engine 0.2.0. [local] brings [onnx].
# 0.2.1: the chunker keeps the text 0.2.0 lost (indexer.TEXT_FIX).
filings = ["myopenfund-rag-engine[local,graph]>=0.2.1,<0.3"]
dev = ["pytest>=8.3", "ruff>=0.6", "pyyaml>=6"]

[project.urls]
Homepage = "https://github.com/MyOpenFund/myopenfund-mcp"
Source = "https://github.com/MyOpenFund/myopenfund-mcp"
Issues = "https://github.com/MyOpenFund/myopenfund-mcp/issues"
Organization = "https://github.com/MyOpenFund"

[project.scripts]
myopenfund-mcp = "myopenfund_mcp.cli:main"

[tool.hatch.version]
path = "src/myopenfund_mcp/__init__.py"

# The sdist carries the sources and the tests, not the repository's CI or local MCP client files.
[tool.hatch.build.targets.sdist]
exclude = ["/.github", "/.mcp.json"]

[tool.hatch.build.targets.wheel]
packages = ["src/myopenfund_mcp"]

[tool.pytest.ini_options]
markers = [
  "integration: needs a real vault database (MOF_MCP_IT_DATABASE_URL), a real company store (MOF_MCP_IT_COMPANIES_CATALOG + MOF_MCP_IT_COMPANIES_DATA_ROOT), a throwaway Qdrant (MOF_MCP_IT_QDRANT_URL) or SEC (MOF_SEC_CONTACT)",
  "llm: needs a local Ollama (MOF_MCP_IT_OLLAMA_URL)",
  "models: downloads the embedding model and reads SEC (MOF_SEC_CONTACT)",
]
addopts = "-m 'not integration and not llm and not models'"

[tool.ruff]
line-length = 110
