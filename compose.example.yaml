# package, at a commit you pin, into a named volume. `mcp` then serves from that volume, mounted
# read-only, with the same hardening as above. A restart of `mcp` alone needs no network.
# `rag-model-fill` is for the FIRST start with the rag toolset only: it downloads the embedding model
# into its volume (outbound HTTPS to huggingface.co and the hosts it redirects to, a writable HOME) and
# verifies it. It succeeded when its log ends with `model cache ready` and it exited with code 0
