# Copy to compose.yaml in YOUR deployment and fill .env (from .env.example).
# Nothing host-specific belongs in this repository: addresses, networks and tokens live in .env.
services:
  mcp:
    build: .
    image: myopenfund-mcp
    env_file: .env
    ports:
      # Default: loopback only. Publish on a private interface (VPN, private network) or put a
      # reverse proxy / cloud load balancer with TLS in front. Never the public internet without TLS.
      - "${MOF_MCP_BIND_ADDR:-127.0.0.1}:${MOF_MCP_BIND_PORT:-8000}:8000"
    restart: unless-stopped
    # Hardening (verified with this image): read-only root filesystem with a writable /tmp,
    # no Linux capabilities, no privilege escalation. Remove a line only if your setup needs it.
    read_only: true
    tmpfs: [/tmp]
    # With the companies/datasets toolsets: DuckDB downloads and loads its ducklake and postgres
    # extensions under $HOME/.duckdb at each start, so HOME must be writable (e.g. HOME=/tmp) and
    # /tmp must allow exec (tmpfs: ["/tmp:exec"]); this needs outbound HTTPS to extensions.duckdb.org.
    # Mount the store's lake/ read-only, as a uid that can read it (my-open-data files may be 0700).
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # To reach a vault Postgres on the same Docker host without publishing its port, join its network
    # (uncomment both blocks and set MOF_VAULT_DOCKER_NETWORK in .env):
    # networks: [vault]
# networks:
#   vault:
#     external: true
#     name: ${MOF_VAULT_DOCKER_NETWORK}
