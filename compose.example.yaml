# Copy to compose.yaml in YOUR deployment and fill .env (from .env.example).
# Nothing host-specific belongs in this repository: addresses, networks and tokens live in .env.
services:
  mcp:
    build: .
    # The image installs the vault extra only. For other toolsets, replace `build: .` with:
    # build:
    #   context: .
    #   args:
    #     MOF_EXTRAS: vault,rag
    image: myopenfund-mcp
    env_file: .env
    ports:
      # Default: loopback only. Publish on a private interface (VPN, private network) or put a
      # reverse proxy / cloud load balancer with TLS in front. Never the public internet without TLS.
      - "${MOF_MCP_BIND_ADDR:-127.0.0.1}:${MOF_MCP_BIND_PORT:-8000}:8000"
    restart: unless-stopped
    # Hardening (verified with this image): read-only root filesystem with a writable /tmp,
    # no Linux capabilities, no privilege escalation. Remove a line only if your setup needs it.
    read_only: true
    tmpfs: [/tmp]
    # With the companies/datasets toolsets: DuckDB downloads and loads its ducklake and postgres
    # extensions under $HOME/.duckdb at each start, so HOME must be writable (e.g. HOME=/tmp) and
    # /tmp must allow exec (tmpfs: ["/tmp:exec"]); this needs outbound HTTPS to extensions.duckdb.org.
    # Mount the store's lake/ read-only, as a uid that can read it (my-open-data files may be 0700).
    environment:
      # The ONNX runtime of the rag toolset would send usage events to its publisher: off. (The server
      # also sets it for itself; an explicit value here wins.) Harmless without the rag toolset.
      ORT_DISABLE_TELEMETRY: "1"
      # The running service never downloads a model: without this, an incomplete model cache makes it
      # try huggingface.co at every start. Only the one-off fill of the cache needs the network.
      HF_HUB_OFFLINE: "1"
    # With the rag toolset (MOF_EXTRAS with rag; MOF_RAG_* in .env, MOF_RAG_MODEL_CACHE=/models and a
    # READ-ONLY Qdrant key in MOF_RAG_QDRANT_API_KEY): the embedding model (about 1.1 GB) lives in a named
    # volume. Fill it once (README, "Deploying the rag toolset": the fill mounts the volume read-write and
    # needs outbound HTTPS to huggingface.co), then mount it read-only here: the running server never
    # downloads or writes a model file.
    # Memory: give the container AT LEAST 3 GB. The process peaks at about 2 GB at every start, while the
    # model loads, and stays around 1.5 GB afterwards; with less it is killed at start. With a CPU limit,
    # set MOF_RAG_ONNX_THREADS to it.
    # Date bounds: MOF_RAG_DATE_FILTER_MODE (auto by default), MOF_RAG_DATE_FILTER_REFRESH_S and
    # MOF_RAG_DATE_FILTER_RETRY_S go in .env like the other MOF_RAG_* variables; the engine's own
    # RAG_ENGINE_DATE_FILTER_* variables are never read by the server. No volume of their own.
    # Uncomment these two blocks and the `volumes:` block at the end of the file:
    # volumes:
    #   - rag-models:/models:ro
    # mem_limit: 3g
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # To reach a vault Postgres on the same Docker host without publishing its port, join its network
    # (uncomment both blocks and set MOF_VAULT_DOCKER_NETWORK in .env):
    # networks: [vault]
# networks:
#   vault:
#     external: true
#     name: ${MOF_VAULT_DOCKER_NETWORK}
# volumes:
#   rag-models:
#     name: myopenfund-mcp-rag-models

